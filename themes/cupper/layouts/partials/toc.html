{{/* Sticky contents rail. Uses Hugo's own TOC (h2–h3, set in config) rather than
     a regex over the rendered HTML, so it works whatever heading levels a post uses. */}}
{{ $items := len (findRE "<li" .TableOfContents) }}
{{ if ge $items 2 }}
  <aside class="toc" aria-labelledby="toc-heading">
    <h2 id="toc-heading">Contents</h2>
    {{ .TableOfContents }}
  </aside>
{{ end }}
