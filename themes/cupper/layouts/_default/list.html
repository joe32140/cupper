{{ define "main" }}
  <main id="main">
    <h1>{{ .Title }}</h1>
    <ul class="post-list">
      {{ range .Pages.ByDate.Reverse }}
        <li>
          {{ if not .Date.IsZero }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time>{{ end }}
          <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
          {{ with .Description }}<p class="post-summary">{{ . | markdownify }}</p>{{ end }}
        </li>
      {{ end }}
    </ul>
  </main>
{{ end }}
